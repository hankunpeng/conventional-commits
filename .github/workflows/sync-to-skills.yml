name: Sync to Skills Repository

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'README_zh.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: hankunpeng/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: target-repo

      - name: Sync Files
        run: |
          if [ -d target-repo/skills/conventional-commits ]; then
            if [ -e target-repo/skills/cc ]; then
              echo "Cannot migrate conventional-commits because skills/cc already exists." >&2
              exit 1
            fi
            git -C target-repo mv -- skills/conventional-commits skills/cc
            perl -pi -e 's/`conventional-commits`/`cc`/g; s/--skill conventional-commits(?=[\s`]|$)/--skill cc/g' \
              target-repo/README.md target-repo/README_zh.md
            git -C target-repo add -- README.md README_zh.md
          fi

          mkdir -p target-repo/skills/cc
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='target-repo' \
            --exclude='LICENSE' \
            --exclude='README.md' \
            --exclude='README_zh.md' \
            ./ target-repo/skills/cc/

      - name: Commit and Push
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- skills/cc
          if ! git diff --cached --exit-code; then
            git commit -m "chore: sync cc from source repository"
            git push
          else
            echo "No changes to commit"
          fi
